[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalium-trainer"
version = "0.1.0"
description = "Signalium deep learning training framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Signalium" }]
keywords = ["machine-learning", "deep-learning", "training", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.3.0",
    "torchmetrics>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "scikit-learn>=1.5.0",
    "mlflow>=2.14.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "requests>=2.32.0",
    "loguru>=0.7.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "typer>=0.12.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "psutil>=6.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "black>=24.4.0",
    "isort>=5.13.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "respx>=0.21.0",
    "responses>=0.25.0",
    "faker>=25.0.0",
]
cuda = [
    "nvidia-ml-py>=12.535.0",
]

[project.scripts]
trainer = "trainer.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["trainer*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: line-too-long — black already enforces line length; URLs/strings are exempt
# F841: unused local variable — common in ML training loops and data pipeline stubs
# E741: ambiguous variable name — single-letter math vars (l, O, I) are idiomatic in ML code
# F821: undefined name — forward references and TYPE_CHECKING guards produce false positives
ignore = ["E501", "F841", "E741", "F821"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=trainer --cov-report=term-missing --cov-report=html"
filterwarnings = ["ignore::DeprecationWarning"]
