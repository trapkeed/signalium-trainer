name: CI

on:
  push:
    branches: [main, develop, production-refactor, trainer-production-v2]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ── Node.js / TypeScript ────────────────────────────────────────────────────

  node-install:
    name: Node — Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  node-typecheck:
    name: Node — Typecheck
    runs-on: ubuntu-latest
    needs: node-install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm run typecheck

  node-build:
    name: Node — Build
    runs-on: ubuntu-latest
    needs: node-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

  # ── Python ──────────────────────────────────────────────────────────────────

  lint:
    name: Python — Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install black isort ruff mypy

      - name: Black format check
        run: black --check --line-length 100 trainer/ tests/

      - name: isort check
        run: isort --check-only --profile black --line-length 100 trainer/ tests/

      - name: Ruff lint
        run: ruff check trainer/ tests/

      - name: mypy type check
        run: mypy trainer/ --ignore-missing-imports --no-strict-optional

  test:
    name: Python — Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu --timeout 120 --retries 3 || \
            pip install torch --timeout 120 --retries 3
          pip install -e ".[dev]" --timeout 300 --retries 5

      - name: Run tests
        run: pytest tests/ --cov=trainer --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ── Docker ──────────────────────────────────────────────────────────────────
  #
  # CI builds and validates the CPU-only image (docker/Dockerfile.cpu).
  # That image uses python:3.12-slim as its base and installs the CPU PyTorch
  # wheel, so it builds on standard GitHub Actions runners with no NVIDIA
  # runtime or physical GPU required.
  #
  # The GPU production image (docker/Dockerfile) is NOT built in CI because
  # it requires the NVIDIA container runtime.  GPU-specific functionality
  # (CUDA kernels, nvidia-ml-py, multi-GPU training) must be validated in a
  # deployment environment that has an NVIDIA runtime available.

  docker-build:
    name: Docker — CPU Image Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Build CPU image ────────────────────────────────────────────────────
      - name: Build CPU Docker image
        run: |
          docker build \
            --tag signalium-trainer:ci-cpu \
            --file docker/Dockerfile.cpu \
            .

      # ── Smoke test — import check, no GPU required ─────────────────────────
      - name: Smoke test — verify trainer imports inside container
        run: |
          docker run --rm --entrypoint python signalium-trainer:ci-cpu -c "
          import torch
          import trainer
          assert not torch.cuda.is_available(), 'Expected CPU-only image to have no CUDA'
          print('smoke test passed — torch', torch.__version__, '| CUDA available:', torch.cuda.is_available())
          "

      # ── GPU tests skipped in CI ────────────────────────────────────────────
      # GPU-dependent tests (CUDA kernels, nvidia-ml-py, multi-GPU) are
      # intentionally skipped here.  Run them on a host that has:
      #   docker run --gpus all --file docker/Dockerfile ...
      - name: Note — GPU tests skipped (no NVIDIA runtime on CI runner)
        run: |
          echo "GPU-accelerated tests are reserved for deployment environments."
          echo "To build and test the GPU image locally:"
          echo "  docker build --tag signalium-trainer:gpu --file docker/Dockerfile ."
          echo "  docker run --gpus all --rm signalium-trainer:gpu trainer doctor"
