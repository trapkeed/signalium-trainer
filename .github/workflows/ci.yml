name: CI

on:
  push:
    branches: [main, develop, production-refactor]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ── Node.js / TypeScript ────────────────────────────────────────────────────

  node-install:
    name: Node — Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  node-typecheck:
    name: Node — Typecheck
    runs-on: ubuntu-latest
    needs: node-install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm run typecheck

  node-build:
    name: Node — Build
    runs-on: ubuntu-latest
    needs: node-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

  # ── Python ──────────────────────────────────────────────────────────────────

  lint:
    name: Python — Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install black isort ruff mypy

      - name: Black format check
        run: black --check --line-length 100 trainer/ tests/

      - name: isort check
        run: isort --check-only --profile black --line-length 100 trainer/ tests/

      - name: Ruff lint
        run: ruff check trainer/ tests/

      - name: mypy type check
        run: mypy trainer/ --ignore-missing-imports --no-strict-optional

  test:
    name: Python — Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ --cov=trainer --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ── Docker ──────────────────────────────────────────────────────────────────

  docker-build:
    name: Docker — Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (no GPU)
        run: |
          docker build \
            --build-arg PYTHON_VERSION=3.12 \
            --tag signalium-trainer:ci \
            --file docker/Dockerfile \
            .
