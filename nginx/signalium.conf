# =============================================================================
# Signalium Trainer — NGINX Site Configuration
# Repo: signalium-trainer (NOT the Signalium platform)
# Target: Ubuntu 24.04 / NGINX 1.24+ / Certbot (Let's Encrypt)
#
# Before enabling:
#   1. Replace every occurrence of YOUR_DOMAIN with your actual domain.
#   2. Run: sudo certbot --nginx -d YOUR_DOMAIN
#      Certbot will add ssl_certificate / ssl_certificate_key lines.
#   3. Enable:
#        sudo ln -s /etc/nginx/sites-available/signalium-trainer \
#                   /etc/nginx/sites-enabled/signalium-trainer
#   4. Test:   sudo nginx -t
#   5. Reload: sudo systemctl reload nginx
# =============================================================================

# ---------------------------------------------------------------------------
# Rate-limiting zones — defined in the http{} context.
# Place these in /etc/nginx/conf.d/signalium-trainer-limits.conf, or add them
# to the http{} block in /etc/nginx/nginx.conf, then uncomment the limit_req
# directives inside the location blocks below.
# ---------------------------------------------------------------------------
# limit_req_zone  $binary_remote_addr  zone=trainer_general:10m  rate=60r/m;
# limit_req_zone  $binary_remote_addr  zone=trainer_strict:10m   rate=10r/m;


# ---------------------------------------------------------------------------
# Upstream — signalium-trainer Express API
# PM2 cluster binds all workers to the same port (TRAINER_PORT, default 8080).
# This is the trainer's own internal port — unrelated to the Signalium platform.
# ---------------------------------------------------------------------------
upstream signalium_trainer {
    least_conn;                         # route to worker with fewest connections
    server 127.0.0.1:8080;
    keepalive 64;                       # reuse connections to the upstream
}


# ---------------------------------------------------------------------------
# HTTP — redirect every request to HTTPS
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name YOUR_DOMAIN;

    # ACME challenge for Certbot renewal (must stay on port 80)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ---------------------------------------------------------------------------
# HTTPS — main server block
# ---------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name YOUR_DOMAIN;

    # -- TLS certificates (filled in by Certbot) ---------------------------
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # -- Security headers --------------------------------------------------
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                                          always;
    add_header X-Content-Type-Options     "nosniff"                                       always;
    add_header X-XSS-Protection           "1; mode=block"                                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"      always;

    # -- General limits ----------------------------------------------------
    client_max_body_size  10M;   # must be >= BODY_LIMIT env var in .env (default 1 MB)
    client_body_timeout   30s;
    client_header_timeout 10s;
    send_timeout          30s;
    keepalive_timeout     65s;

    # -- Logging -----------------------------------------------------------
    access_log  /var/log/nginx/signalium-trainer-access.log  combined;
    error_log   /var/log/nginx/signalium-trainer-error.log   warn;

    # -----------------------------------------------------------------------
    # Public endpoint — health check
    # No auth, no rate limit, no access log.
    # Used by load balancers, uptime monitors, and PM2 health checks.
    # -----------------------------------------------------------------------
    location = /api/healthz {
        proxy_pass         http://signalium_trainer;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        access_log         off;
        proxy_read_timeout 5s;
    }

    # -----------------------------------------------------------------------
    # Private API — all other /api/* routes
    # Requires a valid API_KEY (handled by Express requireApiKey middleware).
    # Rate limiting zones are ready to uncomment once added to nginx.conf.
    # -----------------------------------------------------------------------
    location /api/ {
        # Uncomment after adding trainer rate-limit zones to nginx.conf:
        # limit_req  zone=trainer_general  burst=20  nodelay;
        # limit_req_status 429;

        proxy_pass         http://signalium_trainer;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 5s;

        proxy_intercept_errors on;
    }

    # -----------------------------------------------------------------------
    # Deny direct access to anything outside /api/
    # -----------------------------------------------------------------------
    location / {
        return 404 '{"status":"error","code":"NOT_FOUND","message":"Route not found"}';
        add_header Content-Type application/json always;
    }

    # -----------------------------------------------------------------------
    # Block common attack patterns
    # -----------------------------------------------------------------------
    location ~* \.(env|git|sh|sql|bak|log)$ {
        return 403;
    }
}
