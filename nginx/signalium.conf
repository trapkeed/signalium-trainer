# =============================================================================
# Signalium Trainer API — NGINX Reverse Proxy
# =============================================================================
# Replace trainer.example.com with your real domain before installing:
#   sed -i 's/trainer.example.com/your.domain.com/g' nginx/signalium.conf
#
# Install:
#   sudo cp nginx/signalium.conf /etc/nginx/sites-available/signalium
#   sudo ln -s /etc/nginx/sites-available/signalium \
#              /etc/nginx/sites-enabled/signalium
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (recommended — certbot):
#   sudo certbot --nginx -d trainer.example.com
# =============================================================================

upstream signalium_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name trainer.example.com;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main server block
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name trainer.example.com;

    # --- TLS certificates (managed by certbot or provide manually) ----------
    ssl_certificate     /etc/letsencrypt/live/trainer.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trainer.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # --- Security headers ---------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;

    # --- Logging ------------------------------------------------------------
    access_log /var/log/nginx/signalium-access.log combined;
    error_log  /var/log/nginx/signalium-error.log warn;

    # --- Client limits ------------------------------------------------------
    client_max_body_size 10m;
    keepalive_timeout 65;

    # --- Health check (no auth required — matches Express GET /api/healthz) -
    location = /api/healthz {
        proxy_pass http://signalium_api;

        proxy_http_version      1.1;
        proxy_set_header        Connection        "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        proxy_connect_timeout   5s;
        proxy_read_timeout      10s;
        proxy_send_timeout      10s;

        access_log off;
    }

    # --- API proxy ----------------------------------------------------------
    location /api/ {
        proxy_pass http://signalium_api;

        proxy_http_version      1.1;
        proxy_set_header        Connection        "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        proxy_connect_timeout   10s;
        proxy_read_timeout      60s;
        proxy_send_timeout      60s;

        # Buffer settings
        proxy_buffering         on;
        proxy_buffer_size       4k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }

    # --- Block everything else ----------------------------------------------
    location / {
        return 404;
    }
}
