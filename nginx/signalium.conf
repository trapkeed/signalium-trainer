# =============================================================================
# Signalium Trainer API — NGINX Site Configuration
# Target: Ubuntu 24.04 / NGINX 1.24+ / Certbot (Let's Encrypt)
#
# Before enabling:
#   1. Replace every occurrence of YOUR_DOMAIN with your actual domain.
#   2. Run: sudo certbot --nginx -d YOUR_DOMAIN
#      Certbot will add ssl_certificate / ssl_certificate_key lines.
#   3. Enable: sudo ln -s /etc/nginx/sites-available/signalium \
#                         /etc/nginx/sites-enabled/signalium
#   4. Test:   sudo nginx -t
#   5. Reload: sudo systemctl reload nginx
# =============================================================================

# ---------------------------------------------------------------------------
# Rate-limiting zones (defined in http{} context — place in nginx.conf or
# in /etc/nginx/conf.d/rate-limits.conf if you prefer to keep this file
# inside sites-available/).
#
# If your nginx.conf already has an http{} block you can uncomment these
# and move them there.  The zones are referenced below.
# ---------------------------------------------------------------------------
# limit_req_zone  $binary_remote_addr  zone=api_general:10m  rate=60r/m;
# limit_req_zone  $binary_remote_addr  zone=api_strict:10m   rate=10r/m;


# ---------------------------------------------------------------------------
# Upstream — Express API (PM2 cluster binds all workers to the same port)
# ---------------------------------------------------------------------------
upstream trainer_api {
    least_conn;                         # route to worker with fewest connections
    server 127.0.0.1:8080;
    keepalive 64;                       # reuse connections to the upstream
}


# ---------------------------------------------------------------------------
# HTTP — redirect every request to HTTPS
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name YOUR_DOMAIN;

    # ACME challenge for Certbot renewal (must stay on port 80)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ---------------------------------------------------------------------------
# HTTPS — main server block
# ---------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name YOUR_DOMAIN;

    # -- TLS certificates (filled in by Certbot) ---------------------------
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # -- Security headers --------------------------------------------------
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                                          always;
    add_header X-Content-Type-Options     "nosniff"                                       always;
    add_header X-XSS-Protection           "1; mode=block"                                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"      always;

    # -- General limits ----------------------------------------------------
    client_max_body_size 10M;           # must be >= BODY_LIMIT env var (default 1 MB)
    client_body_timeout  30s;
    client_header_timeout 10s;
    send_timeout         30s;
    keepalive_timeout    65s;

    # -- Logging -----------------------------------------------------------
    access_log  /var/log/nginx/signalium-access.log  combined;
    error_log   /var/log/nginx/signalium-error.log   warn;

    # -----------------------------------------------------------------------
    # Public endpoint — health check (no auth, no rate limit, no access log)
    # Used by: load balancers, uptime monitors, PM2 health checks
    # -----------------------------------------------------------------------
    location = /api/healthz {
        proxy_pass         http://trainer_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        access_log  off;
        proxy_read_timeout 5s;
    }

    # -----------------------------------------------------------------------
    # Private API — all other /api/* routes (rate-limited)
    # -----------------------------------------------------------------------
    location /api/ {
        # Uncomment after adding rate-limit zones to nginx.conf http{} block:
        # limit_req  zone=api_general  burst=20  nodelay;
        # limit_req_status 429;

        proxy_pass         http://trainer_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 5s;

        # Strip the server version from error pages
        proxy_intercept_errors on;
    }

    # -----------------------------------------------------------------------
    # Deny direct access to anything outside /api/
    # -----------------------------------------------------------------------
    location / {
        return 404 '{"status":"error","code":"NOT_FOUND","message":"Route not found"}';
        add_header Content-Type application/json always;
    }

    # -----------------------------------------------------------------------
    # Block common attack patterns
    # -----------------------------------------------------------------------
    location ~* \.(env|git|sh|sql|bak|log)$ {
        return 403;
    }
}
