openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Signalium Platform API — AI Model Registry
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: registry
    description: AI Model Registry
  - name: models
    description: Model management
  - name: versions
    description: Model version management
  - name: artifacts
    description: Model artifact management
  - name: promotion
    description: Lifecycle promotion workflow
  - name: search
    description: Registry search
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /registry/models:
    get:
      operationId: listModels
      tags: [registry, models]
      summary: List registered models
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: architecture
          schema: { type: string }
        - in: query
          name: name
          schema: { type: string }
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/Model"
    post:
      operationId: createModel
      tags: [registry, models]
      summary: Register a new model
      security:
        - AdminApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelRequest"
      responses:
        "201":
          description: Model created
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/ValidationError"

  /registry/models/{modelId}:
    get:
      operationId: getModel
      tags: [registry, models]
      summary: Get model by ID
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: Model detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    $ref: "#/components/schemas/Model"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteModel
      tags: [registry, models]
      summary: Soft-delete a model
      security:
        - AdminApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /registry/models/{modelId}/versions:
    get:
      operationId: listVersions
      tags: [registry, versions]
      summary: List versions for a model
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelVersion"
    post:
      operationId: createVersion
      tags: [registry, versions]
      summary: Register a new model version
      security:
        - AdminApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVersionRequest"
      responses:
        "201":
          description: Version created
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    $ref: "#/components/schemas/ModelVersion"

  /registry/models/{modelId}/versions/{versionId}:
    get:
      operationId: getVersion
      tags: [registry, versions]
      summary: Get a specific model version
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: Version detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    $ref: "#/components/schemas/ModelVersion"
        "404":
          $ref: "#/components/responses/NotFound"

  /registry/models/{modelId}/versions/{versionId}/validate:
    post:
      operationId: validateVersion
      tags: [registry, promotion]
      summary: Trigger validation for a model version
      security:
        - AdminApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: Validation passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /registry/models/{modelId}/versions/{versionId}/promote:
    post:
      operationId: promoteVersion
      tags: [registry, promotion]
      summary: Promote a model version to a new lifecycle status
      security:
        - AdminApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteRequest"
      responses:
        "200":
          description: Promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /registry/models/{modelId}/versions/{versionId}/reject:
    post:
      operationId: rejectVersion
      tags: [registry, promotion]
      summary: Reject a model version
      security:
        - AdminApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /registry/models/{modelId}/versions/{versionId}/archive:
    post:
      operationId: archiveVersion
      tags: [registry, promotion]
      summary: Archive a retired model version
      security:
        - AdminApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /registry/models/{modelId}/versions/{versionId}/artifacts:
    get:
      operationId: listArtifacts
      tags: [registry, artifacts]
      summary: List artifacts for a model version
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: Artifact list
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelArtifact"
    post:
      operationId: uploadArtifact
      tags: [registry, artifacts]
      summary: Upload a model artifact (binary stream)
      security:
        - AdminApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/VersionId"
        - in: header
          name: X-Artifact-Type
          required: true
          schema:
            $ref: "#/components/schemas/ArtifactType"
        - in: header
          name: X-Artifact-Filename
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Artifact uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact:
                    $ref: "#/components/schemas/ModelArtifact"

  /registry/models/{modelId}/versions/{versionId}/artifacts/download/{artifactId}:
    get:
      operationId: downloadArtifact
      tags: [registry, artifacts]
      summary: Download an artifact file
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/VersionId"
        - in: path
          name: artifactId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Binary artifact file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /registry/models/{modelId}/rollback:
    post:
      operationId: rollbackModel
      tags: [registry, promotion]
      summary: Rollback production model to a previous version
      security:
        - AdminApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRequest"
      responses:
        "200":
          description: Rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /registry/search:
    get:
      operationId: searchRegistry
      tags: [registry, search]
      summary: Search the model registry
      security:
        - ApiKeyAuth: []
      parameters:
        - { in: query, name: architecture, schema: { type: string } }
        - { in: query, name: status, schema: { $ref: "#/components/schemas/ModelLifecycleStatus" } }
        - { in: query, name: datasetVersion, schema: { type: string } }
        - { in: query, name: featureVersion, schema: { type: string } }
        - { in: query, name: labelVersion, schema: { type: string } }
        - { in: query, name: experimentId, schema: { type: string } }
        - { in: query, name: gitCommit, schema: { type: string } }
        - { in: query, name: trainerVersion, schema: { type: string } }
        - { in: query, name: mlflowRunId, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  /registry/stats:
    get:
      operationId: getRegistryStats
      tags: [registry, search]
      summary: Registry operational statistics
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Registry stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryStats"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    ModelId:
      in: path
      name: modelId
      required: true
      schema:
        type: string
    VersionId:
      in: path
      name: versionId
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Invalid lifecycle transition or business rule violation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    ModelLifecycleStatus:
      type: string
      enum:
        - uploading
        - uploaded
        - validating
        - validated
        - candidate
        - challenger
        - champion
        - production
        - retired
        - archived
        - rejected

    ArtifactType:
      type: string
      enum:
        - torchscript
        - onnx
        - manifest
        - metadata
        - training_report
        - evaluation_report
        - logs
        - config
        - other

    Model:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        architecture: { type: string }
        framework: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, displayName, architecture, framework, createdBy, createdAt, updatedAt]

    CreateModelRequest:
      type: object
      properties:
        name: { type: string, pattern: "^[a-z0-9_-]+$" }
        displayName: { type: string }
        description: { type: string }
        architecture: { type: string }
        framework: { type: string }
        createdBy: { type: string }
      required: [name, displayName, architecture, createdBy]

    ModelVersion:
      type: object
      properties:
        id: { type: string }
        modelId: { type: string }
        version: { type: string }
        status:
          $ref: "#/components/schemas/ModelLifecycleStatus"
        architecture: { type: string }
        datasetVersion: { type: string }
        featureVersion: { type: string }
        labelVersion: { type: string }
        frameworkVersion: { type: string }
        trainerVersion: { type: string }
        gitCommitHash: { type: string }
        mlflowRunId: { type: string }
        experimentId: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, modelId, version, status, architecture, createdBy, createdAt, updatedAt]

    CreateVersionRequest:
      type: object
      properties:
        version: { type: string }
        architecture: { type: string }
        datasetVersion: { type: string }
        featureVersion: { type: string }
        labelVersion: { type: string }
        frameworkVersion: { type: string }
        trainerVersion: { type: string }
        configVersion: { type: string }
        experimentId: { type: string }
        gitCommitHash: { type: string }
        mlflowRunId: { type: string }
        inputSchema: { type: object }
        outputSchema: { type: object }
        configSnapshot: { type: object }
        createdBy: { type: string }
      required: [version, architecture, createdBy]

    ModelArtifact:
      type: object
      properties:
        id: { type: string }
        modelVersionId: { type: string }
        artifactType:
          $ref: "#/components/schemas/ArtifactType"
        filename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        checksum: { type: string }
        checksumAlgorithm: { type: string }
        status: { type: string }
        uploadedBy: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, modelVersionId, artifactType, filename, mimeType, sizeBytes, uploadedBy, createdAt]

    ValidationResult:
      type: object
      properties:
        passed: { type: boolean }
        report: { type: object }
      required: [passed, report]

    SearchResults:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ModelVersion"
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
          required: [page, limit, total, totalPages]
      required: [results, pagination]

    RegistryStats:
      type: object
      properties:
        total_models: { type: integer }
        total_versions: { type: integer }
        versions_by_status: { type: object }
        champion_count: { type: integer }
        production_count: { type: integer }
      required: [total_models, total_versions, versions_by_status]

    PromoteRequest:
      type: object
      properties:
        targetStatus:
          $ref: "#/components/schemas/ModelLifecycleStatus"
      required: [targetStatus]

    RejectRequest:
      type: object
      properties:
        reason:
          type: string
      required: [reason]

    RollbackRequest:
      type: object
      properties:
        toVersionId:
          type: string
        reason:
          type: string
      required: [toVersionId, reason]
