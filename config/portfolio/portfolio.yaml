# ============================================================
# Phase 20 — Portfolio Intelligence Engine Configuration
# ============================================================

portfolio:
  # Default allocation method (equal_weight | confidence_weight | risk_parity |
  #                             return_scaled | sharpe_scaled | minimum_variance | hybrid)
  default_method: hybrid
  risk_free_rate: 0.045
  database_path: data/portfolio.db

# ── Correlation Engine ──────────────────────────────────────
correlation:
  window: 60
  decay: 0.94
  default_method: rolling    # rolling | rank | tail_lower | tail_upper | exponential
  high_correlation_threshold: 0.70
  min_observations: 10

# ── Regime Detector ─────────────────────────────────────────
regime:
  vol_window: 20
  trend_window: 40
  high_vol_percentile: 0.75
  low_vol_percentile:  0.25
  risk_on_instruments:  [NAS100, SPX500, BTCUSD, AUDUSD, NZDUSD]
  safe_haven_instruments: [XAUUSD, USDJPY, USDCHF]

# ── Risk Budget (default) ───────────────────────────────────
risk_budget:
  preset: default    # default | conservative | aggressive
  max_usd_exposure: 0.60
  max_gold_exposure: 0.25
  max_crypto_exposure: 0.20
  max_index_exposure: 0.35
  max_single_instrument: 0.30
  max_correlated_exposure: 0.50
  max_total_gross: 1.50
  max_forex_exposure: 0.70
  max_commodity_exposure: 0.30
  max_region_exposure: 0.65
  max_long_only: 0.80
  max_short_only: 0.80

# ── Risk Budget Presets ─────────────────────────────────────
risk_budget_presets:
  conservative:
    max_usd_exposure: 0.50
    max_gold_exposure: 0.20
    max_crypto_exposure: 0.10
    max_index_exposure: 0.25
    max_single_instrument: 0.20
    max_correlated_exposure: 0.40
    max_total_gross: 1.20
    max_forex_exposure: 0.60
    max_commodity_exposure: 0.20
    max_region_exposure: 0.55
  aggressive:
    max_usd_exposure: 0.80
    max_gold_exposure: 0.40
    max_crypto_exposure: 0.35
    max_index_exposure: 0.50
    max_single_instrument: 0.45
    max_correlated_exposure: 0.70
    max_total_gross: 2.00
    max_forex_exposure: 0.90
    max_commodity_exposure: 0.45
    max_region_exposure: 0.80

# ── Conflict Resolver ───────────────────────────────────────
conflict_resolver:
  enabled: true
  high_confidence_gap: 0.30
  medium_confidence_gap: 0.10
  safe_haven_risk_severity_scale: 0.70

# ── Dependency Graph ────────────────────────────────────────
dependency_graph:
  edge_threshold: 0.30
  cluster_threshold: 0.60
  max_snapshots: 100

# ── Exposure Engine ─────────────────────────────────────────
exposure:
  asset_class_limit: 0.70
  currency_limit: 0.60
  region_limit: 0.75
  single_instrument_limit: 0.35
  usd_net_limit: 0.55

# ── Optimizer ───────────────────────────────────────────────
optimizer:
  default_objective: max_sharpe  # max_sharpe | min_volatility | max_diversification |
                                  # max_risk_adjusted_return | balanced
  max_iterations: 200
  convergence_tol: 0.00001
  max_weight: 0.40
  min_weight: 0.01
  long_only: true
  efficient_frontier_points: 10

# ── Scenario Analysis ───────────────────────────────────────
scenario:
  default_scenarios:
    - risk_on
    - risk_off
    - high_inflation
    - low_inflation
    - rate_hike
    - rate_cut
    - volatility_spike
    - usd_rally
    - commodity_shock_up
    - credit_crisis
  min_stressed_sharpe_threshold: 0.0
  resilience_floor: 0.50

# ── Instruments ─────────────────────────────────────────────
instruments:
  defaults:
    - symbol: EURUSD
      asset_class: forex
      base: EUR
      quote: USD
      region: europe
    - symbol: GBPUSD
