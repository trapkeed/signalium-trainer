# =============================================================================
# Signalium Trainer — nginx server block
# =============================================================================
# Serves the Research Dashboard static files and reverse-proxies all /api/*
# requests to the Trainer API (Node.js / PM2).
#
# Quick setup — see deploy/nginx/README.md for full instructions.
#
# Before enabling this file, set the correct port:
#   Replace 3000 below with the PORT value from your .env file.
# =============================================================================

upstream trainer_api {
    server 127.0.0.1:3000;    # ← change to match PORT in .env
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # ── Change this to your server's domain or IP ──────────────────────────
    server_name _;

    # ── Static files root ──────────────────────────────────────────────────
    root /opt/signalium-trainer/artifacts/research-dashboard/dist/public;
    index index.html;

    # ── Logging ────────────────────────────────────────────────────────────
    access_log /var/log/nginx/signalium-access.log;
    error_log  /var/log/nginx/signalium-error.log;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy       "strict-origin" always;

    # ── Trainer API proxy — /api/* ─────────────────────────────────────────
    # All API calls from the dashboard use absolute /api/... paths.
    location /api/ {
        proxy_pass         http://trainer_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "keep-alive";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Health endpoint passthrough (no auth, used by uptime monitors) ─────
    location = /health {
        proxy_pass         http://trainer_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ── Hashed static assets — cache aggressively ──────────────────────────
    # Vite fingerprints JS/CSS filenames with a content hash, so these are
    # safe to cache for a long time.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── index.html — never cache; always serve the latest build ────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── SPA fallback — all other paths return index.html ───────────────────
    # React Router handles client-side routing; nginx must not 404 on deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
