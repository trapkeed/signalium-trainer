# Production environment overrides.
environment: production

api:
  base_url: https://api.signalium.io
  timeout: 120
  max_retries: 5
  retry_backoff_factor: 3.0

logging:
  level: INFO
  format: json
  log_dir: /var/log/signalium-trainer
  rotation: 500 MB
  retention: 30 days

mlflow:
  enabled: true
  tracking_uri: https://mlflow.signalium.io
  experiment_name: signalium-trainer-prod
  log_artifacts: true
  log_models: true

gpu:
  device: cuda
  cudnn_benchmark: true
  cudnn_deterministic: false
  allow_tf32: true
