version: "3.9"

# Development-only docker-compose.
# Do NOT use in production or RunPod environments.

services:
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: signalium-trainer:dev
    environment:
      - SIGNALIUM_API_KEY=${SIGNALIUM_API_KEY}
      - SIGNALIUM_TOKEN=${SIGNALIUM_TOKEN}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./exports:/app/exports
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      mlflow:
        condition: service_healthy
    command: doctor

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.0
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root /mlflow/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mlflow_data:
